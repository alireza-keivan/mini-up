{% extends 'base.html' %}
{% load static %}

{% block title %}خانه | {{ SITE_NAME }}{% endblock %}

{% block content %}

<section class="hero-gradient min-h-[80vh] flex items-center justify-center text-center px-4 py-20">

    <div class="max-w-3xl">

        <h1 class="text-4xl md:text-5xl font-black leading-snug mb-6">
            <span class="text-white">به دنیای</span>
            <span class="text-[#ff0055]">گیم و سرگرمی</span> خوش آمدید!
        </h1>

        <p class="text-gray-400 text-lg md:text-xl leading-relaxed mb-10">
            در <span class="text-[#ff0055] font-bold">مینی‌آپ</span> بهترین بازی‌ها و خدمات مجازی را
            با <span class="text-[#00f5ff] font-bold">قیمت مناسب</span> و
            <span class="text-[#bf00ff] font-bold">تحویل فوری</span> دریافت کنید.
        </p>

        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="#" class="btn-primary text-center">
                <i class="fas fa-shopping-bag ml-2"></i> مشاهده محصولات
            </a>
            <a href="#" class="btn-secondary text-center">
                <i class="fas fa-play ml-2"></i> شروع کنید
            </a>
        </div>

    </div>

</section>

{% endblock %}
