{% extends "base.html" %}
{% load static %}

{% block title %}صفحه یافت نشد | 404{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="text-center max-w-lg">
        <!-- Error Code -->
        <div class="relative mb-8">
            <h1 class="text-[150px] md:text-[200px] font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500 opacity-20 select-none">
                404
            </h1>
            <div class="absolute inset-0 flex items-center justify-center">
                <i class="fas fa-ghost text-6xl md:text-8xl text-pink-500 animate-bounce"></i>
            </div>
        </div>
        
        <!-- Message -->
        <h2 class="text-2xl md:text-3xl font-bold text-white mb-4">
            صفحه مورد نظر یافت نشد!
        </h2>
        <p class="text-gray-400 mb-8 leading-relaxed">
            متأسفانه صفحه‌ای که دنبالش هستید وجود ندارد یا حذف شده است.
            <br>
            شاید آدرس را اشتباه وارد کرده‌اید؟
        </p>
        
        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'core:home' %}" class="btn-neon">
                <i class="fas fa-home"></i>
                بازگشت به خانه
            </a>
            <button onclick="history.back()" class="btn-neon-outline">
                <i class="fas fa-arrow-right"></i>
                صفحه قبلی
            </button>
        </div>
    </div>
</div>
{% endblock %}
