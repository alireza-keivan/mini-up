{% extends "base.html" %}
{% load static %}

{% block title %}خطای سرور | 500{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="text-center max-w-lg">
        <!-- Error Code -->
        <div class="relative mb-8">
            <h1 class="text-[150px] md:text-[200px] font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500 opacity-20 select-none">
                500
            </h1>
            <div class="absolute inset-0 flex items-center justify-center">
                <i class="fas fa-exclamation-triangle text-6xl md:text-8xl text-red-500 animate-pulse"></i>
            </div>
        </div>
        
        <!-- Message -->
        <h2 class="text-2xl md:text-3xl font-bold text-white mb-4">
            خطای سرور!
        </h2>
        <p class="text-gray-400 mb-8 leading-relaxed">
            متأسفانه مشکلی در سرور رخ داده است.
            <br>
            تیم فنی ما در حال بررسی مشکل است. لطفاً کمی بعد دوباره تلاش کنید.
        </p>
        
        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'core:home' %}" class="btn-neon">
                <i class="fas fa-home"></i>
                بازگشت به خانه
            </a>
            <button onclick="location.reload()" class="btn-neon-outline">
                <i class="fas fa-redo"></i>
                تلاش مجدد
            </button>
        </div>
    </div>
</div>
{% endblock %}
