{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}مینی‌آپ - خدمات مجازی و محصولات گیمینگ{% endblock %}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}">
    
    <title>{% block title %}مینی‌آپ{% endblock %}</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Main Compiled CSS -->
    <link rel="stylesheet" href="{% static 'css/dist/main.css' %}?v=1.3">

    <!-- Page-specific CSS -->
    {% block extra_css %}{% endblock %}
</head>

<body class="bg-dark-900 text-white font-vazir min-h-screen antialiased">
    
    <!-- Main Content Only (No Header/Footer) -->
    <main class="min-h-screen">
        {% block content %}{% endblock %}
    </main>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Core Utilities -->
    <script src="{% static 'js/utils.js' %}"></script>
    
    <!-- Page-specific JS -->
    {% block extra_js %}{% endblock %}

</body>
</html>
