{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-16">
    <div class="max-w-md mx-auto bg-dark-card rounded-lg p-8">
        <h1 class="text-2xl font-bold text-center mb-6">ثبت نام</h1>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-400 mb-2">نام کاربری</label>
                <input type="text" name="username" class="w-full px-4 py-2 bg-dark-bg border border-gray-700 rounded-lg text-white">
            </div>
            <div class="mb-4">
                <label class="block text-gray-400 mb-2">ایمیل</label>
                <input type="email" name="email" class="w-full px-4 py-2 bg-dark-bg border border-gray-700 rounded-lg text-white">
            </div>
            <div class="mb-6">
                <label class="block text-gray-400 mb-2">رمز عبور</label>
                <input type="password" name="password" class="w-full px-4 py-2 bg-dark-bg border border-gray-700 rounded-lg text-white">
            </div>
            <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white py-2 rounded-lg">ثبت نام</button>
        </form>
        <p class="text-center text-gray-400 mt-4">
            حساب دارید؟ <a href="{% url 'accounts:login' %}" class="text-primary-500">ورود</a>
        </p>
    </div>
</div>
{% endblock %}
