{% extends "base.html" %}
{% load static %}

{% block title %}پروفایل{% endblock %}

{% block content %}
<div class="container mx-auto py-10 max-w-md">
    <h1 class="text-xl font-bold mb-6">پروفایل کاربری</h1>

    <form method="post">
        {% csrf_token %}

        <label class="block mb-2">نام</label>
        <input type="text" name="first_name" value="{{ user.first_name }}" class="w-full border p-2 mb-4">

        <label class="block mb-2">نام خانوادگی</label>
        <input type="text" name="last_name" value="{{ user.last_name }}" class="w-full border p-2 mb-4">

        <button class="w-full bg-blue-600 text-white py-2 rounded">ذخیره</button>
    </form>
</div>
{% endblock %}
