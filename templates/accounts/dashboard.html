{% extends 'base.html' %}

{% block title %}داشبورد | مینی‌آپ{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">داشبورد</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- کارت پروفایل -->
        <a href="{% url 'accounts:profile' %}" class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
            <h3 class="font-semibold text-lg mb-2">پروفایل</h3>
            <p class="text-gray-600">مشاهده و ویرایش اطلاعات شخصی</p>
        </a>
        
        <!-- کارت سفارشات -->
        <a href="{% url 'orders:history' %}" class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
            <h3 class="font-semibold text-lg mb-2">سفارشات</h3>
            <p class="text-gray-600">مشاهده تاریخچه سفارشات</p>
        </a>
        
        <!-- کارت کیف پول -->
        <a href="{% url 'wallet:dashboard' %}" class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
            <h3 class="font-semibold text-lg mb-2">کیف پول</h3>
            <p class="text-gray-600">مدیریت موجودی کیف پول</p>
        </a>
    </div>
</div>
{% endblock %}
