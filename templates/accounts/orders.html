{% extends "base.html" %}
{% load static %}

{% block title %}سفارشات{% endblock %}

{% block content %}
<div class="container mx-auto py-10">
    <h1 class="text-xl font-bold mb-6">سفارشات شما</h1>

    {% if orders %}
        <ul class="space-y-4">
        {% for order in orders %}
            <li class="border p-4 rounded">
                سفارش شماره {{ order.id }} – {{ order.status }}
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>سفارشی ثبت نشده است.</p>
    {% endif %}
</div>
{% endblock %}
